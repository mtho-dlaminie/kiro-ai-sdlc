name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least-privilege: the Gradle build only needs to read repository contents.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintech-customer-insights
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build and test
        run: ./gradlew build --no-daemon

      # JUnit results fallback: upload raw test-results so failures are inspectable
      # without depending on a possibly-unavailable marketplace test-reporter action.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: fintech-customer-insights/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7

  # Playwright HTTP API acceptance tests (acceptance-tests/) against a locally started app.
  # These are deterministic Playwright Test (request fixture) tests — no browser UI, no MCP.
  acceptance-tests:
    name: Acceptance tests (Playwright API)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build application jar
        working-directory: fintech-customer-insights
        run: ./gradlew bootJar --no-daemon

      - name: Install acceptance-test dependencies
        working-directory: acceptance-tests
        run: npm ci || npm install

      - name: Start application
        working-directory: fintech-customer-insights
        run: |
          nohup java -jar build/libs/fintech-customer-insights-*.jar > ../app.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null; then
              echo "App is ready"; exit 0
            fi
            sleep 2
          done
          echo "App did not become ready"; cat app.log; exit 1

      - name: Run Playwright API acceptance tests
        working-directory: acceptance-tests
        env:
          CI: "true"
          BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Stop application
        if: always()
        run: kill "$APP_PID" 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            acceptance-tests/playwright-report/**
            acceptance-tests/test-results/**
          if-no-files-found: warn
          retention-days: 7
